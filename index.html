<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>청소 일정표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"Noto Serif KR","Nanum Myeongjo",Batang,serif;
  --bg:#edf3f4; --surface:#ffffff; --surface-2:#f3f8f9; --fg:#12252d; --muted:#586f79; --line:#d6e1e4;
  --accent:#0a6a86; --accent-ink:#ffffff; --accent-soft:#d8ecf2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b171d; --surface:#12232b; --surface-2:#172c36; --fg:#e4eef1; --muted:#94abb5; --line:#243f4b;
    --accent:#56bfdc; --accent-ink:#05222c; --accent-soft:#123745; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
header{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
h1{font:700 24px/1.3 var(--font-num)}
.sub{color:var(--muted);font-size:13px}
.day{margin-top:22px}
.dayh{display:flex;align-items:baseline;gap:8px;font:700 15px/1.4 var(--font-body);margin:0 2px 8px}
.dayh small{color:var(--muted);font-weight:400;font-size:13px}
.dayh.today{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.job{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;padding:14px;border-top:1px solid var(--line)}
.job:first-child{border-top:0}
.tm{font:700 18px/1.25 var(--font-num);font-variant-numeric:tabular-nums}
.what{min-width:0}
.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.crew{display:inline-flex;align-items:center;height:22px;padding:0 9px;margin-top:6px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
footer{margin-top:28px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>청소 일정표</h1>
    <p class="sub" id="asof"></p>
  </header>
  <main id="list"></main>
  <footer>일정은 변경될 수 있어요. 변경 사항은 담당자에게 확인해 주세요.</footer>
</div>
<script type="application/json" id="data">
{"updated":"2026-10-12T15:45:00+09:00","jobs":[
{"schedule":"2026-10-13T09:00","building":"잠실 월드 빌라","region":"서울 강동구","kind":"빌라 20평","clean":"입주청소","cycle":"비정기","crew":1}
]}
</script>
<script>
(function(){
  var raw=document.getElementById('data').textContent;
  var D=JSON.parse(raw), jobs=D.jobs.slice();
  var DOW='일월화수목금토';
  function pad(n){return String(n).padStart(2,'0');}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  var now=new Date(), today=ymd(now);
  var tm=new Date(now); tm.setDate(tm.getDate()+1); var tomorrow=ymd(tm);
  function label(ds){
    var d=new Date(ds+'T00:00:00'), base=(d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';
    return ds===today?'오늘 · '+base:ds===tomorrow?'내일 · '+base:base;
  }
  var up=new Date(D.updated);
  document.getElementById('asof').textContent='마지막 갱신 '+(up.getMonth()+1)+'월 '+up.getDate()+'일 '+pad(up.getHours())+':'+pad(up.getMinutes());
  jobs=jobs.filter(function(j){return j.schedule.slice(0,10)>=today;}).sort(function(a,b){return a.schedule<b.schedule?-1:a.schedule>b.schedule?1:0;});
  var el=document.getElementById('list');
  if(!jobs.length){el.innerHTML='<div class="panel"><p class="empty">예정된 일정이 없어요.</p></div>';return;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var groups={},order=[];
  jobs.forEach(function(j){var k=j.schedule.slice(0,10);if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(j);});
  el.innerHTML=order.map(function(k){
    return '<section class="day"><h2 class="dayh'+(k===today?' today':'')+'">'+esc(label(k))+' <small>'+groups[k].length+'건</small></h2><div class="panel"><ul>'
    +groups[k].map(function(j){
      var meta=[j.region,j.kind,j.clean,j.cycle].filter(Boolean).map(esc).join(' · ');
      return '<li class="job"><div class="tm">'+esc(j.schedule.slice(11,16))+'</div><div class="what"><div class="name">'+esc(j.building||'일정')+'</div><div class="meta">'+meta+'</div>'+(j.crew?'<span class="crew">'+esc(j.crew)+'명 투입</span>':'')+'</div></li>';
    }).join('')
    +'</ul></div></section>';
  }).join('');
})();
</script>
</body>
</html>
