<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>청소 운영장부 시연</title><style>:root{color-scheme:light}html{scroll-padding-top:0}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 구성: 열면 오늘·내일 일정이 먼저. 모바일은 하단 탭+떠 있는 등록 버튼, 넓은 화면은 좌측 레일. 시간·금액은 세리프 장부체. */
:root{
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"Noto Serif KR","Nanum Myeongjo",Batang,serif;
  --bg:#edf3f4; --surface:#ffffff; --surface-2:#f3f8f9; --fg:#12252d; --muted:#586f79; --line:#d6e1e4;
  --accent:#0a6a86; --accent-ink:#ffffff; --accent-soft:#d8ecf2;
  --in:#127247; --in-soft:#dcf2e6; --out:#ad3f14; --out-soft:#fae4d9; --warn:#8a5d00; --warn-soft:#faefc9;
  --shadow:0 10px 30px rgba(10,40,52,.2); --scrim:rgba(8,24,30,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b171d; --surface:#12232b; --surface-2:#172c36; --fg:#e4eef1; --muted:#94abb5; --line:#243f4b;
    --accent:#56bfdc; --accent-ink:#05222c; --accent-soft:#123745;
    --in:#62d39b; --in-soft:#11382a; --out:#ff9a70; --out-soft:#43241a; --warn:#e9c55c; --warn-soft:#3a3213;
    --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b171d; --surface:#12232b; --surface-2:#172c36; --fg:#e4eef1; --muted:#94abb5; --line:#243f4b;
  --accent:#56bfdc; --accent-ink:#05222c; --accent-soft:#123745;
  --in:#62d39b; --in-soft:#11382a; --out:#ff9a70; --out-soft:#43241a; --warn:#e9c55c; --warn-soft:#3a3213;
  --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 14px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr)}
.main{min-width:0;width:100%;max-width:1040px;margin:0 auto;padding:16px 16px 150px}
.rail{display:none}
.desk-only{display:none!important}

/* 내비게이션 */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 18px var(--font-num);overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-name{font:700 15px/1.3 var(--font-body);overflow-wrap:anywhere}
.brand-sub{font-size:12px;color:var(--muted)}
.navlist{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:none;border-radius:8px;color:var(--muted);text-align:left;font-size:14.5px}
.nav-btn svg,.tab svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--muted);font-size:11.5px;border-radius:8px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:6px;min-height:54px;padding:0 22px;border:0;border-radius:27px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;box-shadow:var(--shadow)}

/* 공통 */
.pagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.pagehead h1{font:700 24px/1.3 var(--font-num)}
.sub{color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav strong{min-width:7.5em;text-align:center;font-weight:700}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;font-size:20px;line-height:1}
.linkbtn{border:0;background:none;color:var(--accent);padding:8px;border-radius:6px;font-size:13.5px}
a.btn{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{background:var(--out);border-color:var(--out);color:var(--surface);font-weight:700}
.btn.ghost{background:none}
.btn.small{min-height:36px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:default}
.mini{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--accent);background:none;color:var(--accent);font-size:12.5px;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-b{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.empty .btn{margin-top:10px}
.up{display:flex;align-items:center;gap:10px;padding:12px 14px}
.up-main{flex:1;min-width:0;cursor:pointer}
.up-main strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.up-main small{color:var(--muted);font-size:12.5px}
.up.late .up-main small{color:var(--out)}
.up .nums{font:700 15px var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.up .btn{flex:none}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h span{padding:8px 0;text-align:center;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.cal-h .sun,.cal-d.sun b{color:var(--out)}.cal-h .sat,.cal-d.sat b{color:var(--accent)}
.cal-x{min-height:54px;border-top:1px solid var(--line);background:var(--surface-2)}
.cal-d{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;padding:6px 2px 4px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;min-width:0}
.cal-g>*:nth-child(7n+1){border-left:0}
.cal-d b{font:600 14px var(--font-body)}
.cal-d.today b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.cal-d.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cal-n{font-style:normal;font-weight:700;font-size:12px;min-width:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-align:center;line-height:20px}
.cal-n.unp{background:var(--out);color:#fff}
.cal-ev{display:none;max-width:100%;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:720px){.cal-d{min-height:96px;align-items:flex-start;padding:6px 8px}.cal-ev{display:block}.cal-n{position:absolute;top:6px;right:6px}}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 2px 8px}
.sech h2{font:700 16px/1.4 var(--font-body)}
.sech small{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
.dayh{display:flex;align-items:baseline;gap:8px;font:700 14px/1.4 var(--font-body);margin:14px 2px 6px}
.dayh small{color:var(--muted);font-weight:400;font-size:12.5px}
.dayh.today{color:var(--accent)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin-bottom:12px;font-size:13.5px}
.banner.err{background:var(--out-soft);color:var(--out)}
.banner.note-in{background:var(--accent-soft);color:var(--accent);font-weight:500}
.banner b{font-weight:700}
.banner .btn{min-height:34px;font-size:13px;background:var(--surface);color:var(--fg);margin-left:auto}
.pill{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}
.pill.run{background:var(--warn-soft);color:var(--warn)}
.pill.done,.pill.paid{background:var(--in-soft);color:var(--in)}
.pill.cancel{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.unpaid{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-bottom:0}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip small{opacity:.8;margin-left:4px}
.in{color:var(--in)} .out{color:var(--out)}
.nums{font-variant-numeric:tabular-nums}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px}
.seg2 button{min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:500}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(10,40,52,.15)}

/* 요약 숫자 */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.kpi{padding:14px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi+.kpi{border-left:1px solid var(--line)}
.k-l{font-size:12px;color:var(--muted)}
.k-v{font:700 clamp(15px,4.6vw,26px)/1.2 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.k-v small{font:500 11px var(--font-body);margin-left:2px;color:var(--muted)}
.k-s{font-size:11.5px;color:var(--muted)}
.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.four .kpi:nth-child(3){border-left:0}
.kpis.four .kpi:nth-child(n+3){border-top:1px solid var(--line)}
.strip{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px;margin-bottom:12px}
.strip b{color:var(--fg);font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--accent)}
.meter.profit>i{background:var(--in)}
.goalrow{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.goalrow .gl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.brow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.brow .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--accent)}
.brow .bar.o i{background:var(--out)}
.brow .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 16px 4px}
.panel-h h2{font:700 15px/1.4 var(--font-body)}

/* 일정 목록 */
.rows>li{border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;padding:14px;cursor:pointer;align-items:start}
.row:hover{background:var(--surface-2)}
.tm{display:flex;flex-direction:column;font:700 17px/1.25 var(--font-num);font-variant-numeric:tabular-nums}
.tm small{font:500 11.5px var(--font-body);color:var(--muted)}
.what{min-width:0}
.l1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:700;font-size:15px}
.l1 strong{overflow-wrap:anywhere}
.l2,.l3{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.money{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.money b{font:700 15px var(--font-num);font-variant-numeric:tabular-nums}
.money .pays{display:flex;gap:6px;align-items:center}
.who{color:var(--muted);font-size:11.5px}
@media (max-width:520px){
  .row{grid-template-columns:50px minmax(0,1fr)}
  .row .money{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:flex-start;text-align:left;gap:8px}
}

/* 표 */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line);font-size:13px}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--muted);font-weight:500;font-size:12px;background:var(--surface-2)}
tbody tr[data-month]{cursor:pointer}
tbody tr[data-month]:hover{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chartbox{width:100%;overflow:hidden}
.chartbox svg{display:block}
.chartbox text{fill:var(--muted);font:11px var(--font-body)}
.chartbox .cur{fill:var(--fg);font-weight:700}
.chartbox line{stroke:var(--line)}
.bar-rev{fill:var(--accent)} .bar-cost{fill:var(--out)}

/* 폼 */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span,.lab{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;min-width:0;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea{min-height:72px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fs{display:block;border:0;border-top:1px solid var(--line);margin:0;padding:14px 0 12px;min-width:0}
.fs:first-of-type{border-top:0;padding-top:4px}
.fs>legend{padding:0 0 8px;font-weight:700;font-size:14px}
.fs>*+*{margin-top:10px}
.hint{font-size:12.5px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg.fill{display:grid;gap:6px}
.seg-opt{position:relative;display:block}
.seg-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.seg-opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font-size:14px}
.seg-opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.msel{display:flex;flex-direction:column;gap:6px}
.crew-row{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.crew-row>*+*{margin-top:0}
.cr-top{display:grid;grid-template-columns:78px minmax(0,1fr) 80px 34px;gap:6px;align-items:center}
.c-cnt{display:flex;align-items:center;gap:4px}
.savebox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.savebox input{width:20px;height:20px;margin:0}
.x-sm{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:18px;line-height:1}
.meta{font-size:12.5px;color:var(--muted);padding:0 0 10px}
details.more{border-top:1px solid var(--line)}
details.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:700;color:var(--accent);font-size:14px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:20px}
details.more[open]>summary::after{content:"−"}
details.more>.inner{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}

/* 시트 */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:640px;max-height:96%;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.sheet-head h2{font:700 19px var(--font-num)}
.sheet form{display:flex;flex-direction:column;min-height:0;flex:1}
#sheetBody{overflow-y:auto;padding:4px 16px 12px;flex:1;overscroll-behavior:contain}
.sheet-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .grow{margin-right:auto}
.sheet-foot .primary{flex:1 1 140px}
.err-text{color:var(--out);font-size:13.5px;padding:4px 2px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(142px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;box-shadow:var(--shadow)}
.toast a{color:inherit;font-weight:700;text-decoration:underline}
.copyarea{min-height:200px;font-size:14px;line-height:1.6}

/* 설정·세무 */
.settings-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.le ul{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.le li{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px}
.le-add{display:flex;gap:6px}
.le h3{font:700 14px var(--font-body);margin-bottom:2px}
.staff-row{display:grid;grid-template-columns:minmax(0,1fr) 78px 100px 34px;gap:6px;margin-bottom:6px}
.logo-edit{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo-edit .brand-mark{width:64px;height:64px;font-size:26px;border-radius:14px}
.lic-prev{max-width:100%;max-height:220px;border:1px solid var(--line);border-radius:8px}
.dl-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.dl{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.dl h3{font:700 14.5px var(--font-body)}
.dl p{color:var(--muted);font-size:13px}
.dl .btn{align-self:flex-start}
.guide{display:flex;flex-direction:column;gap:12px}
.guide h3{font:700 14px var(--font-body);margin-bottom:2px}
.guide p,.guide li{font-size:13px;color:var(--muted)}
.guide ul{display:flex;flex-direction:column;gap:3px;list-style:disc;padding-left:18px}
.note{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.loading{padding:48px 0;text-align:center;color:var(--muted)}

@media (min-width:640px){
  .dl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpis.four .kpi:nth-child(3){border-left:1px solid var(--line)}
  .kpis.four .kpi:nth-child(n+3){border-top:0}
}
@media (min-width:900px){
  .app{grid-template-columns:224px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:22px;padding:24px 14px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
  .tabbar,.fab{display:none}
  .desk-only{display:inline-flex!important}
  .main{padding:28px 32px 56px}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:18px;max-height:90%}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

'경남':['창원시','진주시','통영시','사천시','김해시','밀양시','거제시','양산시','의령군','함안군','창녕군','고성군','남해군','하동군','산청군','함양군','거창군','합천군'],
'제주':['제주시','서귀포시']
};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const num=n=>Math.round(+n||0).toLocaleString('ko-KR');
const won=n=>num(n)+'원';
const man=n=>n%10000===0?(n/10000).toLocaleString('ko-KR')+'만원':won(n);
const digits=s=>+String(s==null?'':s).replace(/[^\d]/g,'')||0;
const bySchedule=(a,b)=>(a.schedule||'')<(b.schedule||'')?-1:(a.schedule||'')>(b.schedule||'')?1:0;
const regionOf=j=>((j.sido||'')+' '+(j.gu||'')).trim();
const titleOf=j=>j.building||j.customer||(((j.buildingType||'')+' '+(j.pyeong?j.pyeong+'평':'')).trim())||'일정';

function defaultSettings(){return{
  business:{name:'',rep:'',regNo:'',bizType:'서비스업',bizItem:'청소',taxType:'일반과세',vatIncluded:true,phone:'',email:'',address:'',logo:'',license:null,defaultFeeRate:2},
  leadSources:['소개','당근','기타'],
  buildingTypes:['빌라','아파트','사무실','원룸','기타'],
  staff:[],
  expenseItems:{'고정경비':['사무실 임대료','통신비','차량 보험료','차량 할부금','구독료'],'여비비':['세금·공과금','청소도구 구입','소모품','장비 수리','광고비'],'이동경비':['주유비','통행료','주차비','대중교통'],'식대':['점심','저녁','간식·음료']},
  goals:{}
};}
function mergeSettings(raw){
  const d=defaultSettings(); raw=raw||{};
  const out=Object.assign({},d,raw);
  out.business=Object.assign({},d.business,raw.business||{});
  out.expenseItems=Object.assign({},d.expenseItems,raw.expenseItems||{});
  out.leadSources=Array.isArray(raw.leadSources)?raw.leadSources.slice():d.leadSources;
  out.buildingTypes=Array.isArray(raw.buildingTypes)?raw.buildingTypes.slice():d.buildingTypes;
  out.staff=Array.isArray(raw.staff)?raw.staff.slice():[];
  out.goals=raw.goals||{};
  return out;
}
function statusOf(j,now){
  const m=j.statusMode||'auto';
  if(m!=='auto')return m;
  const t=new Date(j.schedule);
  if(isNaN(t))return '대기';
  if(now<t)return '대기';
  if(ymd(now)===ymd(t))return j.payStatus==='완료'?'완료':'진행중';
  return '완료';
}
function laborOf(j){
  let internal=0,external=0;
  for(const c of (j.crew||[])){const v=(+c.count||0)*(+c.pay||0); if(c.type==='외부')external+=v; else internal+=v;}
  return{internal,external};
}
function crewText(j){
  let i=0,o=0;
  for(const c of (j.crew||[])){const n=+c.count||0; if(c.type==='외부')o+=n; else i+=n;}
  const p=[];if(i)p.push('내부 '+i+'명');if(o)p.push('외부 '+o+'명');
  return p.join(', ');
}
function headcount(j){return (j.crew||[]).reduce((s,c)=>s+(+c.count||0),0);}
const fmtHours=h=>(Number.isInteger(+h)?(+h):(+h).toFixed(1))+'시간';
function feeOf(j){
  return (j.payMethod==='카드'&&j.feeMode==='업체부담')?Math.round((+j.amount||0)*(+j.feeRate||0)/100):0;
}
function vatSplit(amount,b){
  amount=+amount||0;
  if(!b||b.taxType!=='일반과세')return{supply:amount,vat:0,total:amount,applicable:false};
  if(b.vatIncluded){const supply=Math.round(amount/1.1);return{supply,vat:amount-supply,total:amount,applicable:true};}
  const vat=Math.round(amount*0.1);
  return{supply:amount,vat,total:amount+vat,applicable:true};
}
const dayText=d=>(d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';
function dayLabel(ds,todayStr){
  const t=new Date(todayStr+'T00:00:00'),d=new Date(ds+'T00:00:00');
  const diff=Math.round((d-t)/86400000),base=dayText(d);
  return diff===0?'오늘 · '+base:diff===1?'내일 · '+base:diff===2?'모레 · '+base:base;
}
function shareText(j){
  const d=new Date(j.schedule);
  const L=['[청소 일정] '+dayText(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())];
  if(j.building)L.push('건물: '+j.building);
  if(j.customer)L.push('고객: '+j.customer);
  if(regionOf(j))L.push('지역: '+regionOf(j));
  const what=[((j.buildingType||'')+' '+(j.pyeong?j.pyeong+'평':'')).trim(),j.cleanKind==='입주'?'입주청소':j.cleanKind==='거주'?'거주청소':'',j.cycle].filter(Boolean).join(' · ');
  if(what)L.push('내용: '+what);
  if(crewText(j))L.push('인원: '+crewText(j));
  if(j.memo)L.push('메모: '+j.memo);
  return L.join('\n');
}
function shareMany(list,title){
  return '['+title+' '+list.length+'건]\n\n'+list.map(shareText).map(t=>t.replace(/^\[청소 일정\] /,'')).join('\n\n');
}
function calLink(j){
  const s=new Date(j.schedule);
  if(isNaN(s))return '';
  const e=new Date(s.getTime()+4*3600*1000);
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const det=[];
  if(j.customer)det.push('고객: '+j.customer+(j.phone?' ('+j.phone+')':''));
  const what=[((j.buildingType||'')+' '+(j.pyeong?j.pyeong+'평':'')).trim(),j.cleanKind==='입주'?'입주청소':j.cleanKind==='거주'?'거주청소':'',j.cycle].filter(Boolean).join(' · ');
  if(what)det.push(what);
  det.push('계약금: '+won(j.amount)+' ('+(j.payStatus==='완료'?'입금완료':'입금대기')+')');
  if(crewText(j))det.push('인원: '+crewText(j));
  if(j.memo)det.push('메모: '+j.memo);
  const loc=[regionOf(j),j.building].filter(Boolean).join(' ');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('청소 · '+titleOf(j))+'&dates='+f(s)+'/'+f(e)+'&ctz='+encodeURIComponent('Asia/Seoul')+'&details='+encodeURIComponent(det.join('\n'))+'&location='+encodeURIComponent(loc);
}
function emptyAgg(){return{nAll:0,nDone:0,nUpcoming:0,nCancel:0,revenue:0,received:0,receivable:0,upcoming:0,laborIn:0,laborOut:0,fee:0,fixed:0,misc:0,travel:0,meal:0};}
function finalize(a){a.labor=a.laborIn+a.laborOut;a.expense=a.fixed+a.misc+a.travel+a.meal;a.cost=a.labor+a.fee+a.expense;a.profit=a.revenue-a.cost;return a;}
function monthAgg(key,jobs,exps,now){
  const a=emptyAgg();
  for(const j of jobs){
    if((j.schedule||'').slice(0,7)!==key)continue;
    a.nAll++;
    const st=statusOf(j,now),amt=+j.amount||0;
    if(st==='취소'){a.nCancel++;continue;}
    if(st==='완료'){
      a.nDone++;a.revenue+=amt;
      if(j.payStatus==='완료')a.received+=amt;else a.receivable+=amt;
      const l=laborOf(j);a.laborIn+=l.internal;a.laborOut+=l.external;a.fee+=feeOf(j);
    }else{a.nUpcoming++;a.upcoming+=amt;}
  }
  for(const e of exps){
    if((e.date||'').slice(0,7)!==key)continue;
    const k=GROUPKEY[e.group]; if(k)a[k]+=+e.amount||0;
  }
  return finalize(a);
}
function yearAgg(year,jobs,exps,now){
  const months=[],tot=emptyAgg();
  for(let m=1;m<=12;m++){
    const a=monthAgg(year+'-'+pad(m),jobs,exps,now);months.push(a);
    for(const k in tot)tot[k]+=a[k];
  }
  finalize(tot);
  return{months,total:tot};
}
function inPeriod(dateStr,year,period){
  if(!dateStr||+dateStr.slice(0,4)!==+year)return false;
  const m=+dateStr.slice(5,7);
  if(period==='all')return true;
  if(period==='h1')return m<=6;
  if(period==='h2')return m>=7;
  return m===+period;
}
function csvCell(v){
  if(v==null)return '';
  if(typeof v==='string'&&/^[=+@\t\r]|^-(?!\d)/.test(v))v="'"+v;
  v=String(v);
  return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function toCSV(head,rows){return '﻿'+[head].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n');}
function doneJobs(jobs,year,period,now){return jobs.filter(j=>inPeriod(j.schedule,year,period)&&statusOf(j,now)==='완료').sort(bySchedule);}
function salesExport(jobs,st,year,period,now){
  const b=st.business,items=doneJobs(jobs,year,period,now);
  const head=['청소일시','건물명','고객명','건물유형','평형','지역','청소구분','정기/비정기','결제방식','증빙','합계금액','공급가액','부가세','입금상태','유입경로'];
  let total=0;
  const rows=items.map(j=>{const v=vatSplit(j.amount,b);total+=v.total;
    return[j.schedule.replace('T',' '),j.building||'',j.customer||'',j.buildingType||'',j.pyeong?j.pyeong+'평':'',regionOf(j),j.cleanKind==='입주'?'입주청소':'거주청소',j.cycle||'',j.payMethod||'',j.proof||'',v.total,v.applicable?v.supply:'',v.applicable?v.vat:'',j.payStatus==='완료'?'입금완료':'입금대기',j.source||''];});
  return{head,rows,count:rows.length,total};
}
function expenseExport(jobs,exps,year,period){
  const jm={};for(const j of jobs)jm[j.id]=j;
  const items=exps.filter(e=>inPeriod(e.date,year,period)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const head=['일자','구분','항목','거래처','금액','결제방식','증빙','연결 일정','메모'];
  let total=0;
  const rows=items.map(e=>{total+=+e.amount||0;const j=e.jobId?jm[e.jobId]:null;
    return[e.date,e.group,e.item||'',e.vendor||'',+e.amount||0,e.payMethod||'',e.proof||'',j?(j.schedule.slice(0,10)+' '+titleOf(j)).trim():'',e.memo||''];});
  return{head,rows,count:rows.length,total};
}
function laborExport(jobs,year,period,now){
  const head=['청소일시','건물·고객','구분','이름','인원','인당 경비','지급액','3.3% 원천징수 시 (예상)','실지급액 (예상)','소요시간(시간)'];
  const rows=[];let total=0;
  for(const j of doneJobs(jobs,year,period,now)){
    for(const c of (j.crew||[])){
      const pay=(+c.count||0)*(+c.pay||0),wh=c.type==='외부'?Math.round(pay*0.033):'';
      total+=pay;
      rows.push([j.schedule.replace('T',' '),[j.building,j.customer].filter(Boolean).join(' / '),c.type||'',c.name||'',+c.count||0,+c.pay||0,pay,wh,wh===''?'':pay-wh,+j.hours>0?+j.hours:'']);

const Store={mode:'loading',db:null,mem:{jobs:{},expenses:{},settings:{}},cb:{},
  async init(cb){
    this.cb=cb;let db=null;
    try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){}
    if(db){
      this.mode='cloud';this.db=db;
      const fail=e=>{S.err=(e&&e.code)||'unavailable';renderBanner();};
      db.collection('jobs').onSnapshot(s=>cb.jobs(s.docs.map(d=>Object.assign({},d.data(),{id:d.id}))),fail);
      db.collection('expenses').onSnapshot(s=>cb.expenses(s.docs.map(d=>Object.assign({},d.data(),{id:d.id}))),fail);
      db.doc('settings/main').onSnapshot(s=>cb.settings(s.exists?s.data():{}),fail);
    }else{
      this.mode='local';
      let seeded=false;
      try{const raw=localStorage.getItem('cleanops.demo.v1');if(raw){const o=JSON.parse(raw);this.mem=Object.assign(this.mem,o);seeded=!!o.seeded;}}catch(e){}
      if(!seeded){this.mem=demoData();this.persist();}
      this.emit();
    }
    S.mode=this.mode;
  },
  emit(){
    const L=o=>Object.keys(o).map(k=>Object.assign({},o[k],{id:k}));
    this.cb.jobs(L(this.mem.jobs));this.cb.expenses(L(this.mem.expenses));this.cb.settings(this.mem.settings||{});
  },
  persist(){try{localStorage.setItem('cleanops.demo.v1',JSON.stringify(this.mem));}catch(e){}},
  async put(col,id,obj){
    const o=Object.assign({},obj);delete o.id;
    if(this.mode==='cloud')return this.db.collection(col).doc(id).set(o);
    this.mem[col][id]=o;this.persist();this.emit();
  },
  async del(col,id){
    if(this.mode==='cloud')return this.db.collection(col).doc(id).delete();
    delete this.mem[col][id];this.persist();this.emit();
  },
  async putSettings(obj){
    if(this.mode==='cloud')return this.db.doc('settings/main').set(obj);
    this.mem.settings=obj;this.persist();this.emit();
  }
};

function monthNav(){
  return '<div class="monthnav"><button type="button" class="iconbtn" data-act="mprev" aria-label="이전 달">‹</button><strong>'+monthLabel(S.month)+'</strong><button type="button" class="iconbtn" data-act="mnext" aria-label="다음 달">›</button>'+(S.month!==ymOf(new Date())?'<button type="button" class="linkbtn" data-act="mtoday">이번 달</button>':'')+'</div>';
}
const deskBtn=(act,label)=>S.readOnly?'':'<button type="button" class="btn primary desk-only" data-act="'+act+'">+ '+label+'</button>';
const kpi=(l,v,sub,c)=>'<div class="kpi"><span class="k-l">'+l+'</span><b class="k-v '+(c||'')+'">'+num(v)+'<small>원</small></b>'+(sub?'<span class="k-s">'+sub+'</span>':'')+'</div>';
function meterHTML(label,val,target,extra){
  const pct=target>0?Math.round(val/target*100):0;
  return '<div class="goalrow"><div class="gl"><span>'+label+'</span><span class="nums"><b>'+won(val)+'</b> / '+won(target)+' ('+pct+'%)</span></div><div class="meter '+(extra||'')+'" role="img" aria-label="'+label+' 달성률 '+pct+'%"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div></div>';
}
function jobRow(j,now,opt){
  opt=opt||{};
  const st=statusOf(j,now),paid=j.payStatus==='완료',n=crewText(j);
  const l2=[j.building&&j.customer?'고객 '+j.customer:'',((j.buildingType||'')+' '+(j.pyeong?j.pyeong+'평':'')).trim(),regionOf(j)].filter(Boolean).map(esc).join(' · ');
  const l3=[j.cleanKind==='입주'?'입주청소':j.cleanKind==='거주'?'거주청소':'',j.cycle,n,(+j.hours>0?fmtHours(j.hours):''),j.source].filter(Boolean).map(esc).join(' · ');
  const tm=opt.date?'<small>'+fmtDay(j.schedule)+'</small>'+fmtTime(j.schedule):fmtTime(j.schedule);
  return '<li><div class="row" tabindex="0" role="button" data-open="job" data-id="'+esc(j.id)+'"><div class="tm">'+tm+'</div><div class="what"><div class="l1"><strong>'+esc(titleOf(j))+'</strong><span class="pill '+cls[st]+'">'+st+'</span></div><div class="l2">'+l2+'</div><div class="l3">'+l3+'</div></div><div class="money"><b class="nums">'+won(j.amount)+'</b><span class="pays"><span class="pill '+(paid?'paid':'unpaid')+'">'+(paid?'입금완료':'입금대기')+'</span>'+(!paid&&st!=='취소'&&!S.readOnly?'<button type="button" class="mini" data-act="paid" data-id="'+esc(j.id)+'">입금확인</button>':'')+'</span></div></div></li>';
}
function groupHTML(list,now,todayStr){
  const g={},order=[];
  for(const j of list){const k=(j.schedule||'').slice(0,10);if(!g[k]){g[k]=[];order.push(k);}g[k].push(j);}
  return order.map(k=>'<section><h3 class="dayh'+(k===todayStr?' today':'')+'">'+esc(dayLabel(k,todayStr))+' <small>'+g[k].length+'건</small></h3><div class="panel"><ul class="rows">'+g[k].map(j=>jobRow(j,now)).join('')+'</ul></div></section>').join('');
}
function barRows(items,total,o){
  if(!items.length||!total)return '<p class="empty" style="padding:10px 0">아직 자료가 없어요.</p>';
  return items.map(it=>'<div class="brow"><span>'+esc(it[0])+'</span><div class="bar '+(o||'')+'"><i style="width:'+Math.round(it[1]/total*100)+'%"></i></div><span class="v">'+won(it[1])+(it[2]?' · '+esc(it[2]):'')+'</span></div>').join('');
}
function unpaidLine(j,todayStr){
  const d=(j.schedule||'').slice(0,10),late=d&&d<todayStr,dt=new Date(j.schedule);
  const when=isNaN(dt)?'':(dt.getMonth()+1)+'/'+dt.getDate();
  const sub=[when,j.customer].filter(Boolean).map(esc).join(' · ');
  return '<li class="up'+(late?' late':'')+'"><div class="up-main" data-open="job" data-id="'+esc(j.id)+'"><strong>'+esc(titleOf(j))+'</strong><small>'+sub+(late?' · 지난 일정':'')+'</small></div><b class="nums">'+won(j.amount)+'</b>'+(S.readOnly?'':'<button type="button" class="btn small" data-act="paid" data-id="'+esc(j.id)+'">입금완료</button>')+'</li>';
}
function viewHome(){
  const now=new Date(),todayStr=ymd(now),tm=new Date(now);tm.setDate(tm.getDate()+1);const tmrStr=ymd(tm);
  const a=monthAgg(ymOf(now),S.jobs,S.expenses,now),yr=now.getFullYear(),yt=yearAgg(yr,S.jobs,S.expenses,now).total,goal=S.settings.goals[yr]||{};
  const act=S.jobs.filter(j=>statusOf(j,now)!=='취소').sort(bySchedule);
  const today=act.filter(j=>(j.schedule||'').slice(0,10)===todayStr);
  const tomorrow=act.filter(j=>(j.schedule||'').slice(0,10)===tmrStr);
  const upcoming=act.filter(j=>{const s=statusOf(j,now);return (j.schedule||'').slice(0,10)>todayStr&&(s==='대기'||s==='진행중');}).slice(0,8);
  const unpaid=S.jobs.filter(j=>j.payStatus!=='완료'&&statusOf(j,now)!=='취소').sort(bySchedule);
  const sample=S.jobs.some(j=>j.isSample)||S.expenses.some(e=>e.isSample);
  let h='<div class="pagehead"><div><p class="sub">'+esc(S.settings.business.name||APP_NAME)+'</p><h1>'+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+DOW[now.getDay()]+'요일</h1></div>'+deskBtn('newJob','일정 등록')+'</div>';
  if(sample&&!S.readOnly)h+='<div class="banner">예시 데이터가 들어 있어요. 실제 업무를 시작하기 전에 지워 주세요. <button type="button" class="btn" data-act="clearSample">예시 데이터 지우기</button></div>';
  if(tomorrow.length)h+='<div class="banner note-in"><span>내일 일정 <b>'+tomorrow.length+'건</b> · 첫 일정 '+fmtTime(tomorrow[0].schedule)+' '+esc(titleOf(tomorrow[0]))+'</span><button type="button" class="btn" data-act="copyTomorrow">안내 문구 복사</button></div>';
  h+='<div class="sech"><h2>오늘 일정<small>'+today.length+'건</small></h2></div>';
  h+=today.length?'<div class="panel"><ul class="rows">'+today.map(j=>jobRow(j,now)).join('')+'</ul></div>':'<div class="panel"><p class="empty">오늘은 일정이 없어요.'+(S.readOnly?'':'<br><button type="button" class="btn primary" data-act="newJob">+ 일정 등록</button>')+'</p></div>';
  h+='<div class="sech"><h2>다가오는 일정</h2><button type="button" class="linkbtn" data-go="jobs">전체 보기</button></div>';
  h+=upcoming.length?groupHTML(upcoming,now,todayStr):'<div class="panel"><p class="empty">앞으로 잡힌 일정이 없어요.</p></div>';
  if(unpaid.length){
    const tot=unpaid.reduce((a,j)=>a+(+j.amount||0),0),LIM=3;
    h+='<div class="sech"><h2>입금 대기<small>'+unpaid.length+'건 · '+won(tot)+'</small></h2>'+(unpaid.length>LIM?'<button type="button" class="linkbtn" data-act="showUnpaid">전체 보기</button>':'')+'</div><div class="panel"><ul class="rows">'+unpaid.slice(0,LIM).map(j=>unpaidLine(j,todayStr)).join('')+'</ul></div>';
    if(unpaid.length>LIM)h+='<p class="sub" style="margin:6px 2px">외 '+(unpaid.length-LIM)+'건</p>';
  }
  h+='<div class="sech"><h2>이번 달 정산<small>'+monthLabel(ymOf(now))+'</small></h2><button type="button" class="linkbtn" data-go="report">자세히</button></div>';
  h+='<section class="kpis" aria-label="이번 달 요약">'+kpi('매출',a.revenue,'완료 '+a.nDone+'건')+kpi('지출',a.cost,'','out')+kpi('순이익',a.profit,a.revenue?'이익률 '+Math.round(a.profit/a.revenue*100)+'%':'',a.profit>=0?'in':'out')+'</section>';
  h+='<p class="strip"><span>입금완료 <b>'+won(a.received)+'</b></span><span>미수금 <b>'+won(a.receivable)+'</b></span><span>예정 매출 <b>'+won(a.upcoming)+'</b></span></p>';
  if(goal.revenue>0||goal.profit>0)h+='<section class="panel"><div class="panel-h"><h2>'+yr+'년 목표</h2><button type="button" class="linkbtn" data-go="goal">수정</button></div><div class="panel-b">'+(goal.revenue>0?meterHTML('연 매출',yt.revenue,goal.revenue):'')+(goal.profit>0?meterHTML('연 순이익',yt.profit,goal.profit,'profit'):'')+'</div></section>';
  h+='<div class="actions" style="margin-top:16px"><button type="button" class="btn" data-go="expenses">지출 보기</button><button type="button" class="btn" data-go="tax">세무자료 받기</button></div>';
  return h;
}
function calHTML(all,now,todayStr){
  const p=S.month.split('-').map(Number),y=p[0],mo=p[1],lead=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate();
  const by={};
  all.forEach(j=>{if(statusOf(j,now)==='취소')return;const d=+(j.schedule||'').slice(8,10);(by[d]=by[d]||[]).push(j);});
  const sel=S.calDay&&S.calDay.slice(0,7)===S.month?S.calDay:(todayStr.slice(0,7)===S.month?todayStr:'');
  let c='<div class="cal"><div class="cal-h">'+DOW.split('').map((d,i)=>'<span'+(i===0?' class="sun"':i===6?' class="sat"':'')+'>'+d+'</span>').join('')+'</div><div class="cal-g">';
  for(let i=0;i<lead;i++)c+='<span class="cal-x"></span>';
  for(let d=1;d<=dim;d++){
    const k=S.month+'-'+pad(d),js=by[d]||[],unp=js.some(j=>j.payStatus!=='완료'),dow=(lead+d-1)%7;
    c+='<button type="button" class="cal-d'+(k===todayStr?' today':'')+(k===sel?' sel':'')+(dow===0?' sun':dow===6?' sat':'')+'" data-act="calDay" data-v="'+k+'" aria-label="'+mo+'월 '+d+'일 일정 '+js.length+'건"><b>'+d+'</b>'
      +(js.length?'<i class="cal-n'+(unp?' unp':'')+'">'+js.length+'</i>':'')
      +js.slice(0,2).map(j=>'<small class="cal-ev">'+fmtTime(j.schedule)+' '+esc(titleOf(j))+'</small>').join('')
      +(js.length>2?'<small class="cal-ev">+'+(js.length-2)+'건</small>':'')+'</button>';
  }
  c+='</div></div>';
  c+='<p class="sub" style="margin:6px 2px">숫자는 그날 일정 건수예요. 붉은 숫자는 입금이 안 된 일정이 있다는 뜻이에요.</p>';
  if(sel){
    const js=by[+sel.slice(8)]||[];
    c+='<div class="sech"><h2>'+esc(dayLabel(sel,todayStr))+'<small>'+js.length+'건</small></h2></div>'
      +(js.length?'<div class="panel"><ul class="rows">'+js.map(j=>jobRow(j,now)).join('')+'</ul></div>':'<div class="panel"><p class="empty">이 날은 일정이 없어요.'+(S.readOnly?'':'<br><button type="button" class="btn primary" data-act="newJob">+ 일정 등록</button>')+'</p></div>');
  }else c+='<div class="panel"><p class="empty">날짜를 누르면 그날 일정이 아래에 보여요.</p></div>';
  return c;
}
function viewToggle(){return '<div class="seg2" role="group" aria-label="보기 방식"><button type="button" data-act="jview" data-v="list" aria-pressed="'+(S.jview!=='cal')+'">목록</button><button type="button" data-act="jview" data-v="cal" aria-pressed="'+(S.jview==='cal')+'">달력</button></div>';}
function viewJobs(){
  const now=new Date(),todayStr=ymd(now),a=monthAgg(S.month,S.jobs,S.expenses,now);
  const all=S.jobs.filter(j=>(j.schedule||'').slice(0,7)===S.month).sort(bySchedule);
  const F=['전체','대기','진행중','완료','취소','입금대기'];
  const m=(j,f)=>f==='전체'||(f==='입금대기'?(j.payStatus!=='완료'&&statusOf(j,now)!=='취소'):statusOf(j,now)===f);
  const list=all.filter(j=>m(j,S.jf));
  return '<div class="pagehead"><h1>일정</h1><div class="actions">'+monthNav()+deskBtn('newJob','일정 등록')+'</div></div>'
   +'<p class="strip"><span>이 달 <b>'+all.length+'건</b></span><span>완료 매출 <b>'+won(a.revenue)+'</b></span><span>미수금 <b>'+won(a.receivable)+'</b></span><span>예정 <b>'+won(a.upcoming)+'</b></span></p>'
   +viewToggle()+(S.jview==='cal'?calHTML(all,now,todayStr):'<div class="chips" role="group" aria-label="상태 필터">'+F.map(f=>'<button type="button" class="chip" data-act="jf" data-v="'+f+'" aria-pressed="'+(S.jf===f)+'">'+f+'<small>'+all.filter(j=>m(j,f)).length+'</small></button>').join('')+'</div>'
   +(list.length?groupHTML(list,now,todayStr):'<div class="panel"><p class="empty">'+(all.length?'조건에 맞는 일정이 없어요.':monthLabel(S.month)+'에 등록된 일정이 없어요.')+(S.readOnly?'':'<br><button type="button" class="btn primary" data-act="newJob">+ 일정 등록</button>')+'</p></div>'));
}
function viewExpenses(){
  const now=new Date(),a=monthAgg(S.month,S.jobs,S.expenses,now);
  const all=S.expenses.filter(e=>(e.date||'').slice(0,7)===S.month).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0);
  const list=all.filter(e=>S.ef==='전체'||e.group===S.ef);
  const jm={};for(const j of S.jobs)jm[j.id]=j;
  const rows=list.map(e=>{const j=e.jobId?jm[e.jobId]:null;
    return '<li><div class="row" tabindex="0" role="button" data-open="exp" data-id="'+esc(e.id)+'"><div class="tm">'+fmtDay(e.date)+'</div><div class="what"><div class="l1"><strong>'+esc(e.item||'항목 없음')+'</strong><span class="pill">'+esc(e.group)+'</span></div><div class="l2">'+[e.vendor,e.payMethod,e.proof,j?'일정: '+titleOf(j):''].filter(Boolean).map(esc).join(' · ')+'</div>'+(e.memo?'<div class="l3">'+esc(e.memo)+'</div>':'')+'</div><div class="money"><b class="nums out">'+won(e.amount)+'</b></div></div></li>';}).join('');
  return '<div class="pagehead"><h1>지출</h1><div class="actions">'+monthNav()+deskBtn('newExp','지출 등록')+'</div></div>'
   +'<section class="kpis four" aria-label="이달 지출 요약">'+kpi('고정경비',a.fixed)+kpi('여비비',a.misc)+kpi('이동경비',a.travel)+kpi('식대',a.meal)+'</section>'
   +'<p class="strip"><span>직접 입력한 지출 <b>'+won(a.expense)+'</b></span><span>인건비 <b>'+won(a.labor)+'</b></span><span>카드수수료 <b>'+won(a.fee)+'</b></span></p><p class="hint" style="margin:-4px 2px 12px">인건비와 카드수수료는 일정에 입력한 내용으로 자동 계산돼요.</p>'
   +'<div class="chips" role="group" aria-label="구분 필터">'+['전체'].concat(GROUPS).map(f=>'<button type="button" class="chip" data-act="ef" data-v="'+f+'" aria-pressed="'+(S.ef===f)+'">'+f+'</button>').join('')+'</div>'
   +(list.length?'<section class="panel"><ul class="rows">'+rows+'</ul></section>':'<div class="panel"><p class="empty">'+monthLabel(S.month)+'에 등록된 지출이 없어요.'+(S.readOnly?'':'<br><button type="button" class="btn primary" data-act="newExp">+ 지출 등록</button>')+'</p></div>');
}
function viewReport(){
  return '<div class="pagehead"><h1>정산</h1></div><div class="seg2" role="group" aria-label="정산 메뉴"><button type="button" data-act="rtab" data-v="sum" aria-pressed="'+(S.rtab==='sum')+'">월·연 정산</button><button type="button" data-act="rtab" data-v="tax" aria-pressed="'+(S.rtab==='tax')+'">세무자료</button></div>'+(S.rtab==='tax'?taxBody():sumBody());
}
function sumBody(){
  const now=new Date(),yr=S.year,ya=yearAgg(yr,S.jobs,S.expenses,now),t=ya.total,goal=S.settings.goals[yr]||{};
  const cur=now.getFullYear()===yr?now.getMonth()+1:0;
  let goalText='';
  if(goal.revenue>0){
    const left=Math.max(0,goal.revenue-t.revenue);
    if(yr===now.getFullYear()){const rm=12-now.getMonth();goalText='남은 '+rm+'개월(이번 달 포함) 동안 월 평균 '+won(left/rm)+'을 더 벌면 목표예요.';}
    else if(yr<now.getFullYear())goalText=left>0?'목표까지 '+won(left)+' 부족했어요.':'목표를 달성했어요.';
    else goalText='목표 매출을 12개월로 나누면 월 '+won(goal.revenue/12)+'이에요.';
  }
  const rowsM=ya.months.map((a,i)=>'<tr data-month="'+yr+'-'+pad(i+1)+'"><td>'+(i+1)+'월'+(cur===i+1?' ·현재':'')+'</td><td>'+a.nDone+'</td><td>'+num(a.revenue)+'</td><td>'+num(a.labor)+'</td><td>'+num(a.fee+a.expense)+'</td><td class="'+(a.profit<0?'out':'')+'">'+num(a.profit)+'</td></tr>').join('');
  const brk=[['인건비(내부)',t.laborIn],['인건비(외부)',t.laborOut],['카드수수료',t.fee],['고정경비',t.fixed],['여비비',t.misc],['이동경비',t.travel],['식대',t.meal]];
  const sm={},cn={};
  for(const j of S.jobs){if((j.schedule||'').slice(0,4)!==String(yr)||statusOf(j,now)!=='완료')continue;const k=j.source||'미입력';sm[k]=(sm[k]||0)+(+j.amount||0);cn[k]=(cn[k]||0)+1;}
  const src=Object.keys(sm).map(k=>[k,sm[k],cn[k]+'건']).sort((x,y)=>y[1]-x[1]);
  return '<div class="pagehead"><span class="sub">연도를 바꿔 지난 기록도 볼 수 있어요.</span><div class="monthnav"><button type="button" class="iconbtn" data-act="yprev" aria-label="이전 해">‹</button><strong>'+yr+'년</strong><button type="button" class="iconbtn" data-act="ynext" aria-label="다음 해">›</button></div></div>'
   +'<section class="kpis four" aria-label="연간 요약">'+kpi(yr+'년 매출',t.revenue,'완료 '+t.nDone+'건')+kpi('총 지출',t.cost,'','out')+kpi('순이익',t.profit,t.revenue?'이익률 '+Math.round(t.profit/t.revenue*100)+'%':'',t.profit>=0?'in':'out')+kpi('여비비',t.misc,'세금·도구구입 등')+'</section>'
   +'<div class="cols">'
   +'<section class="panel"><div class="panel-h"><h2>연 목표</h2></div><div class="panel-b">'
   +(goal.revenue>0?meterHTML('연 매출',t.revenue,goal.revenue):'')+(goal.profit>0?meterHTML('연 순이익',t.profit,goal.profit,'profit'):'')
   +(goalText?'<p class="hint" style="margin-bottom:10px">'+goalText+'</p>':'')
   +(S.readOnly?'':'<form id="goalForm" class="stack" style="gap:10px"><div class="f2"><label class="fld"><span>연 매출 목표(원)</span><input type="text" inputmode="numeric" name="gRev" value="'+(goal.revenue?num(goal.revenue):'')+'" placeholder="예: 60,000,000"></label><label class="fld"><span>연 순이익 목표(원)</span><input type="text" inputmode="numeric" name="gProfit" value="'+(goal.profit?num(goal.profit):'')+'" placeholder="예: 24,000,000"></label></div><div><button type="submit" class="btn primary small">목표 저장</button></div></form>')
   +'</div></section>'
   +'<section class="panel"><div class="panel-h"><h2>지출 구성</h2><span class="sub">'+yr+'년 합계</span></div><div class="panel-b">'+barRows(brk.filter(x=>x[1]>0),t.cost,'o')+'</div></section>'
   +'<section class="panel"><div class="panel-h"><h2>유입경로별 매출</h2><span class="sub">완료 기준</span></div><div class="panel-b">'+barRows(src,src.reduce((s,x)=>s+x[1],0))+'</div></section></div>'
   +hoursPanel(yr,now)
   +regionPanel(yr,now)
   +'<section class="panel" style="margin-top:14px"><div class="panel-h"><h2>월별 매출과 지출</h2></div><div class="panel-b"><div class="legend"><span><i style="background:var(--accent)"></i>매출</span><span><i style="background:var(--out)"></i>지출</span><span>단위: 원 (만·억 표기)</span></div><div class="chartbox" id="chart"></div></div></section>'

function hoursPanel(yr,now){

    const h=+j.hours||0,c=headcount(j);

    n++;hrs+=h;

function regionPanel(yr,now){
  const m={};let tot=0,cnt=0;
  for(const j of S.jobs){
    if((j.schedule||'').slice(0,4)!==String(yr)||statusOf(j,now)!=='완료')continue;
    const k=regionOf(j)||'지역 미입력',a=+j.amount||0;
    (m[k]=m[k]||{k,n:0,rev:0});m[k].n++;m[k].rev+=a;tot+=a;cnt++;
  }
  const list=Object.keys(m).map(k=>Object.assign(m[k],{avg:m[k].rev/m[k].n}));
  const key=S.rs;list.sort((x,y)=>y[key]-x[key]||y.rev-x.rev);
  const max=Math.max(1,...list.map(x=>x[key]));
  const S3=[['rev','매출 많은 순'],['n','건수 많은 순'],['avg','건당 매출 높은 순']];
  const rows=list.map((x,i)=>'<tr><td>'+(i+1)+'. '+esc(x.k)+'</td><td>'+x.n+'</td><td>'+num(x.rev)+'</td><td>'+num(x.avg)+'</td><td>'+(tot?Math.round(x.rev/tot*100):0)+'%</td></tr>').join('');
  const bars=list.slice(0,8).map(x=>'<div class="brow"><span>'+esc(x.k)+'</span><div class="bar"><i style="width:'+Math.round(x[key]/max*100)+'%"></i></div><span class="v">'+(key==='n'?x.n+'건':won(key==='avg'?x.avg:x.rev))+'</span></div>').join('');
  return '<section class="panel" style="margin-top:14px"><div class="panel-h"><h2>지역별 실적</h2><span class="sub">'+yr+'년 완료 기준</span></div><div class="panel-b">'
   +(list.length?'<div class="chips" role="group" aria-label="정렬">'+S3.map(o=>'<button type="button" class="chip" data-act="rs" data-v="'+o[0]+'" aria-pressed="'+(S.rs===o[0])+'">'+o[1]+'</button>').join('')+'</div>'+bars+'<p class="hint" style="margin-top:6px">많이 한 지역(건수)과 돈이 되는 지역(건당 매출)을 나눠서 볼 수 있어요. 상위 8곳을 그래프로, 전체는 아래 표로 보여요.</p></div><div class="tablewrap"><table><thead><tr><th>지역</th><th>건수</th><th>매출</th><th>건당 평균</th><th>비중</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>':'<p class="empty" style="padding:10px 0">완료된 일정이 생기면 지역별로 정리돼요.</p></div></section>');
}
function drawChart(){
  const el=$('#chart');if(!el)return;
  const ya=yearAgg(S.year,S.jobs,S.expenses,new Date()).months;
  const w=Math.max(280,el.clientWidth||340),h=200,L=42,R=6,Tp=8,B=24,cw=w-L-R,ch=h-Tp-B;
  const maxV=Math.max(1,...ya.map(m=>Math.max(m.revenue,m.cost)));
  const step=niceStep(maxV/4),top=step*Math.ceil(maxV/step),yv=v=>Tp+ch-(v/top)*ch;
  let s='';
  for(let v=0;v<=top+1e-9;v+=step){s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+yv(v)+'" y2="'+yv(v)+'"/><text x="'+(L-5)+'" y="'+(yv(v)+4)+'" text-anchor="end">'+axisLabel(Math.round(v))+'</text>';}
  const gw=cw/12,bw=Math.max(3,Math.min(14,gw*0.34)),curM=S.year===T0.getFullYear()?new Date().getMonth()+1:0;
  ya.forEach((m,i)=>{
    const cx=L+gw*i+gw/2,hr=ch*m.revenue/top,hc=ch*m.cost/top,mm=i+1;
    s+='<rect class="bar-rev" x="'+(cx-bw-1)+'" y="'+(Tp+ch-hr)+'" width="'+bw+'" height="'+hr+'" rx="2"><title>'+mm+'월 매출 '+won(m.revenue)+'</title></rect>';
    s+='<rect class="bar-cost" x="'+(cx+1)+'" y="'+(Tp+ch-hc)+'" width="'+bw+'" height="'+hc+'" rx="2"><title>'+mm+'월 지출 '+won(m.cost)+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(h-7)+'" text-anchor="middle"'+(curM===mm?' class="cur"':'')+'>'+mm+'</text>';
  });
  el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="'+S.year+'년 월별 매출과 지출 막대그래프">'+s+'</svg>';
}

  }

  const obj={building:f.building.value.trim(),customer:f.customer.value.trim(),phone:f.phone.value.trim(),buildingType:f.buildingType.value,pyeong:+f.pyeong.value,cleanKind:f.cleanKind.value,cycle:f.cycle.value,sido:f.sido.value,gu,
    schedule:f.date.value+'T'+(f.time.value||'09:00'),statusMode:f.statusMode.value||'auto',amount,payStatus:f.payStatus.value,payMethod:f.payMethod.value,feeMode:f.feeMode.value||'업체부담',feeRate:+f.feeRate.value||0,proof:f.proof.value,
    crew,hours:Math.min(24,Math.max(0,Math.round((+f.hours.value||0)*2)/2)),source:(f.source&&f.source.value)||'',memo:f.memo.value.trim(),
    authorId:old?old.authorId:(S.me.id||'local'),createdAt:old?old.createdAt:stamp,updatedAt:stamp};
  if(old&&old.isSample)obj.isSample=true;
  const id=old?old.id:uid();
  const btn=$('#saveBtn');if(btn)btn.disabled=true;
  try{
    await Store.put('jobs',id,obj);
    if(newStaff.length)await saveSettings(s=>{for(const m of newStaff){if(!s.staff.some(x=>x.name===m.name))s.staff.push(m);}});
    if(!old)S.month=obj.schedule.slice(0,7);
    closeSheet();render();
    if(old)toast('수정했어요');
    else toast('일정을 등록했어요',{href:calLink(obj),label:'구글 캘린더에 저장'});
  }
  catch(e){showErr('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');if(btn)btn.disabled=false;console.error(e);}
}
async function saveExp(form){
  const f=form.elements,old=S.sheet.old;
  const amount=digits(f.amount.value),item=f.itemSel.value==='custom'?f.itemCustom.value.trim():f.itemSel.value;

  if(!item)return showErr('항목을 선택하거나 입력해 주세요.');
  const stamp=new Date().toISOString();
  const obj={date:f.date.value,group:f.group.value,item,amount,vendor:f.vendor.value.trim(),payMethod:f.payMethod.value,proof:f.proof.value,jobId:f.jobId.value||'',memo:f.memo.value.trim(),
    authorId:old?old.authorId:(S.me.id||'local'),createdAt:old?old.createdAt:stamp,updatedAt:stamp};
  if(old&&old.isSample)obj.isSample=true;

  catch(e){showErr('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');if(btn)btn.disabled=false;console.error(e);}
}
let settingsChain=Promise.resolve();
function saveSettings(mut){
  settingsChain=settingsChain.then(async()=>{
    const next=JSON.parse(JSON.stringify(S.settings));
    mut(next);next.updatedAt=new Date().toISOString();
    S.settings=mergeSettings(next);
    try{await Store.putSettings(next);}catch(e){toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');console.error(e);}
  });
  return settingsChain;
}
const listRef=(s,id)=>id==='src'?s.leadSources:id==='bld'?s.buildingTypes:(s.expenseItems[id.slice(4)]||(s.expenseItems[id.slice(4)]=[]));
async function propagateRename(id,from,to){
  let col='',list=[],apply=null;
  if(id==='src'){col='jobs';list=S.jobs.filter(j=>j.source===from);apply=o=>{o.source=to;};}
  else if(id==='bld'){col='jobs';list=S.jobs.filter(j=>j.buildingType===from);apply=o=>{o.buildingType=to;};}
  else{const g=id.slice(4);col='expenses';list=S.expenses.filter(e=>e.group===g&&e.item===from);apply=o=>{o.item=to;};}
  for(const r of list){const o=JSON.parse(JSON.stringify(r));apply(o);o.updatedAt=new Date().toISOString();try{await Store.put(col,r.id,o);}catch(e){break;}}
}
async function downloadCSV(key){
  const now=new Date(),y=S.taxYear,p=S.taxPeriod,st=S.settings;
  const nm=id=>authorName(id);
  const map={sales:()=>salesExport(S.jobs,st,y,p,now),exp:()=>expenseExport(S.jobs,S.expenses,y,p),labor:()=>laborExport(S.jobs,y,p,now),sum:()=>summaryExport(S.jobs,S.expenses,y,now),bakJobs:()=>jobsBackup(S.jobs,nm),bakExp:()=>expensesBackup(S.expenses,nm)};
  const names={sales:'매출내역',exp:'지출내역',labor:'인건비지급내역',sum:'월별요약',bakJobs:'일정원본',bakExp:'지출원본'};
  const ex=map[key]();const csv=toCSV(ex.head,ex.rows);
  const per=key==='sum'||key.startsWith('bak')?'':'_'+(p==='all'?'연간':p==='h1'?'1기':p==='h2'?'2기':(+p)+'월');
  const fname=(S.settings.business.name?S.settings.business.name+'_':'')+names[key]+'_'+(key.startsWith('bak')?ymd(new Date()):y+per)+'.csv';
  if(!S.dl){try{await navigator.clipboard.writeText(csv);toast('이 화면에서는 파일 저장이 막혀 있어 내용을 복사했어요. 엑셀에 붙여넣어 주세요.');}catch(e){toast('이 화면에서는 파일을 내려받을 수 없어요.');}return;}
  try{await S.dl.save({filename:fname,data:csv});toast('파일을 저장했어요');}
  catch(e){toast(e&&e.code==='declined'?'저장을 취소했어요':'파일을 저장하지 못했어요');}
}
function fileToLogo(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const m=200,r=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/png'));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};
    img.src=url;
  });
}
async function uploadLicense(file){
  if(!file)return;
  if(!/^(image\/(png|jpeg|webp|gif)|application\/pdf)$/.test(file.type)){toast('PNG, JPG, WEBP, GIF 이미지나 PDF만 올릴 수 있어요.');return;}
  let assets=null;try{assets=window.claude&&await window.claude.use('assets');}catch(e){}
  if(!assets){toast('이 화면에서는 파일을 올릴 수 없어요. 편집 권한이 있는 화면에서 시도해 주세요.');return;}
  try{
    const res=await assets.upload(file,{type:file.type}),old=S.settings.business.license;
    await saveSettings(s=>{s.business.license={id:res.id,name:file.name.slice(0,80),type:file.type,at:new Date().toISOString()};});
    if(old&&old.id){try{await assets.delete(old.id);}catch(e){}}
    toast('사업자등록증을 저장했어요');render();
  }catch(e){toast(e&&e.code==='too_large'?'파일이 너무 커요(20MB 이하).':'파일을 올리지 못했어요.');}
}
async function clearSample(){
  if(!guard())return;
  const js=S.jobs.filter(j=>j.isSample),es=S.expenses.filter(e=>e.isSample);
  try{for(const j of js)await Store.del('jobs',j.id);for(const e of es)await Store.del('expenses',e.id);toast('예시 데이터를 지웠어요');}
  catch(e){toast('일부를 지우지 못했어요. 다시 시도해 주세요.');}
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act],[data-go],[data-open],tr[data-month]');

  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.month!==undefined&&t.tagName==='TR'){S.month=t.dataset.month;go('jobs');return;}
  if(t.dataset.open){if(t.dataset.open==='job')openJob(t.dataset.id);else openExp(t.dataset.id);return;}
  const a=t.dataset.act,v=t.dataset.v;
  switch(a){
    case 'mprev':S.month=shiftMonth(S.month,-1);render();break;
    case 'mnext':S.month=shiftMonth(S.month,1);render();break;
    case 'mtoday':S.month=ymOf(new Date());render();break;
    case 'yprev':S.year--;render();break;
    case 'ynext':S.year++;render();break;
    case 'rtab':S.rtab=v;render();break;
    case 'jf':S.jf=v;render();break;
    case 'ef':S.ef=v;render();break;
    case 'rs':S.rs=v;render();break;
    case 'newJob':if(guard())openJob('');break;
    case 'newExp':if(guard())openExp('');break;
    case 'closeSheet':closeSheet();break;
    case 'setDate':{const inp=$('#sheetForm [name="date"]');if(inp){const d=new Date();d.setDate(d.getDate()+(+v||0));inp.value=ymd(d);updateHints();}break;}
    case 'paid':{if(!guard())break;const j=S.jobs.find(x=>x.id===t.dataset.id);if(j){const o=JSON.parse(JSON.stringify(j));o.payStatus='완료';o.updatedAt=new Date().toISOString();await Store.put('jobs',j.id,o);toast('입금완료로 바꿨어요');}break;}
    case 'copyJob':{if(S.sheet&&S.sheet.old)copyText(shareText(S.sheet.old),'안내 문구');break;}
    case 'copyTomorrow':{const tm=new Date();tm.setDate(tm.getDate()+1);const k=ymd(tm),now=new Date();const l=S.jobs.filter(j=>(j.schedule||'').slice(0,10)===k&&statusOf(j,now)!=='취소').sort(bySchedule);if(l.length)copyText(shareMany(l,'내일 청소 일정'),'내일 일정 안내 문구');break;}
    case 'setHours':{const i=$('#sheetForm [name="hours"]');if(i)i.value=v;break;}
    case 'showUnpaid':S.jf='입금대기';go('jobs');break;
    case 'jview':S.jview=v==='cal'?'cal':'list';try{localStorage.setItem('cleanops.jview',S.jview);}catch(e){}render();break;
    case 'calDay':S.calDay=v;render();break;
    case 'resetDemo':{try{localStorage.removeItem('cleanops.demo.v1');}catch(e){}Store.mem=demoData();Store.persist();Store.emit();toast('예시 데이터를 처음 상태로 되돌렸어요');break;}
    case 'clearSample':clearSample();break;
    case 'dl':downloadCSV(t.dataset.k);break;
    case 'addCrew':{$('#crewList').insertAdjacentHTML('beforeend',crewRowHTML({type:'내부',count:1,pay:0}));syncSave($('#crewList').lastElementChild);updateHints();break;}
    case 'addStaff':{const m=S.settings.staff[+t.dataset.i];if(!m)break;if($$('#crewList .c-name').some(i=>i.value.trim()===m.name)){toast(m.name+' 님은 이미 추가했어요.');break;}const l=$('#crewList');l.insertAdjacentHTML('beforeend',crewRowHTML({type:m.type,name:m.name,count:1,pay:m.pay||0}));syncSave(l.lastElementChild);updateHints();break;}
    case 'rmCrew':t.closest('.crew-row').remove();updateHints();break;
    case 'askDelete':$('#delBtns').hidden=true;$('#delAsk').hidden=false;break;
    case 'cancelDelete':$('#delBtns').hidden=false;$('#delAsk').hidden=true;break;
    case 'doDelete':{if(!guard()||!S.sheet||!S.sheet.old)break;const k=S.sheet.kind;try{await Store.del(k==='job'?'jobs':'expenses',S.sheet.old.id);closeSheet();toast('삭제했어요');render();}catch(e){showErr('삭제하지 못했어요. 다시 시도해 주세요.');}break;}
    case 'leAdd':{if(!guard())break;const box=t.closest('.le'),inp=$('.le-new',box),val=inp.value.trim(),id=box.dataset.le;if(!val)break;await saveSettings(s=>{const r=listRef(s,id);if(!r.includes(val))r.push(val);});render();break;}
    case 'leDel':{if(!guard())break;const box=t.closest('.le'),id=box.dataset.le,i=+t.dataset.i;await saveSettings(s=>{listRef(s,id).splice(i,1);});render();break;}
    case 'stAdd':{if(!guard())break;const n=$('#stNewName').value.trim();if(!n)break;const type=$('#stNewType').value,pay=digits($('#stNewPay').value);await saveSettings(s=>{if(!s.staff.some(m=>m.name===n))s.staff.push({name:n,type,pay});});render();break;}
    case 'stDel':{if(!guard())break;const i=+t.dataset.i;await saveSettings(s=>{s.staff.splice(i,1);});render();break;}
    case 'logoDel':if(guard()){await saveSettings(s=>{s.business.logo='';});render();}break;
    case 'licDel':{if(!guard())break;let assets=null;try{assets=window.claude&&await window.claude.use('assets');}catch(e){}const old=S.settings.business.license;await saveSettings(s=>{s.business.license=null;});if(assets&&old&&old.id){try{await assets.delete(old.id);}catch(e){}}toast('사업자등록증을 삭제했어요');render();break;}
    case 'licDl':{const l=S.settings.business.license;if(!l||!l.id)break;try{const r=await fetch('/_blob/'+l.id);const blob=await r.blob();if(S.dl)await S.dl.save({filename:l.name||'사업자등록증',data:blob});else toast('이 화면에서는 내려받을 수 없어요.');}catch(e){toast(e&&e.code==='declined'?'저장을 취소했어요':'파일을 내려받지 못했어요.');}break;}
  }
});
